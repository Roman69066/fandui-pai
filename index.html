<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反怼派</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16110F;
    --bg-2: #1F1815;
    --red: #E8391C;
    --red-dim: #7a1e10;
    --yellow: #E8A93A;
    --paper: #F3E9D8;
    --muted: #8a7a6c;
    --line: #3a2f28;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(232,57,28,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(232,169,58,0.06), transparent 50%),
      var(--bg);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  .eyebrow {
    display:flex; align-items:center; gap:10px;
    font-size: 13px; letter-spacing: 0.02em;
    color: var(--red);
    margin-bottom: 18px;
  }
  .eyebrow::before {
    content: "";
    width: 18px; height: 2px; background: var(--red);
    display:inline-block;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(48px, 12vw, 76px);
    line-height: 0.92;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--paper);
    text-shadow: 3px 3px 0 var(--red-dim);
  }
  .tagline {
    font-style: italic;
    color: var(--paper);
    opacity: 0.85;
    font-size: 14px;
    margin: 0 0 40px;
    padding: 12px 16px 12px 14px;
    background: rgba(232,57,28,0.10);
    border-left: 3px solid var(--red);
  }
  .tagline b { color: var(--yellow); font-style: normal; }

  .intake {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    padding: 22px;
    position: relative;
  }
  .intake::before {
    content: "案 号 #" attr(data-id);
    position: absolute; top: -10px; left: 20px;
    background: var(--bg);
    padding: 0 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  textarea {
    width: 100%;
    min-height: 96px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    line-height: 1.6;
    padding: 4px 2px;
  }
  textarea::placeholder { color: var(--muted); opacity: 0.85; }

  .intake-footer {
    display:flex; justify-content: space-between; align-items:center;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .hint { font-size: 11px; color: var(--muted); }

  button#fire {
    background: var(--red);
    color: var(--paper);
    border: none;
    font-family: 'Archivo Black', sans-serif;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 13px 26px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button#fire:hover:not(:disabled) { background: #ff4a26; }
  button#fire:active:not(:disabled) { transform: translateY(1px); }
  button#fire:disabled { background: var(--red-dim); cursor: default; color: rgba(243,233,216,0.5); }

  /* gauge */
  .gauge-row {
    display:none;
    align-items: center;
    gap: 16px;
    margin: 30px 0 4px;
  }
  .gauge-row.show { display:flex; }
  .gauge-label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .gauge-track {
    flex: 1;
    height: 6px;
    background: linear-gradient(90deg, var(--muted), var(--yellow) 55%, var(--red) 100%);
    border-radius: 3px;
    position: relative;
    opacity: 0.35;
  }
  .gauge-needle {
    position: absolute;
    top: -5px;
    width: 3px; height: 16px;
    background: var(--paper);
    border-radius: 2px;
    left: 0%;
    transition: left 1.1s cubic-bezier(.2,.9,.25,1);
    box-shadow: 0 0 8px rgba(243,233,216,0.6);
  }
  .gauge-tag {
    font-size: 11px;
    color: var(--paper);
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 3px 8px;
    white-space: nowrap;
  }

  /* receipt output */
  .receipt {
    display:none;
    margin-top: 26px;
    background: var(--paper);
    color: #241d18;
    padding: 30px 26px 26px;
    position: relative;
    font-size: 16px;
    line-height: 1.85;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }
  .receipt.show { display:block; }
  .receipt::before {
    content: "";
    position: absolute;
    top: -8px; left: 0; right: 0;
    height: 16px;
    background:
      radial-gradient(circle at 8px 0, transparent 8px, var(--paper) 8.5px) top left / 16px 16px repeat-x;
  }
  .receipt-head {
    display:flex; justify-content: space-between;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8a7a6c;
    margin-bottom: 16px;
    border-bottom: 1px dashed #c9bba5;
    padding-bottom: 10px;
  }
  .receipt-body { white-space: pre-wrap; }
  .cursor {
    display:inline-block; width:8px; height:16px; background:#241d18;
    vertical-align: -3px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .again-row { display:none; margin-top: 18px; text-align:center; }
  .again-row.show { display:block; }
  .again-row button {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .again-row button:hover { border-color: var(--red); color: var(--paper); }

  .foot-note {
    margin-top: 56px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.04em;
  }

  ::selection { background: var(--red); color: var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">在你做重要决定以前，先来这里挨一顿怼</div>
  <h1>反怼派</h1>
  <p class="tagline">代码提交以前要跑一次测试，论文发表以前要同行评审，公司投资以前要做尽职调查——你的重要决定作出之前，同样要跑一次反方测试。</p>

  <div class="intake" id="caseId" data-id="0001">
    <textarea id="input" placeholder="说说你最近那个自信满满的决定，我马上让你怀疑人生。"></textarea>
    <div class="intake-footer">
      <span class="hint">想清楚了再发，我不接不完整的话。</span>
      <button id="fire">怼我</button>
    </div>
  </div>

  <div class="gauge-row" id="gaugeRow">
    <span class="gauge-label">赌注</span>
    <div class="gauge-track"><div class="gauge-needle" id="needle"></div></div>
    <span class="gauge-tag" id="gaugeTag">判断中…</span>
  </div>

  <div class="receipt" id="receipt">
    <div class="receipt-head"><span>反怼派 · 判词</span><span id="stamp"></span></div>
    <div class="receipt-body" id="receiptBody"></div>
  </div>

  <div class="again-row" id="againRow"><button id="again">再挨一怼</button></div>

  <div class="foot-note">立案：<span id="caseCount">1</span> 起</div>
</div>

<script>
let caseNum = 1;

function setCaseId(n) {
  document.getElementById('caseId').setAttribute('data-id', String(n).padStart(4,'0'));
}

function stakeToPercent(stake, rev) {
  if (stake === '低') return 12;
  if (rev === '可逆') return 45;
  if (rev === '半可逆') return 68;
  if (rev === '不可逆') return 92;
  return 55;
}
function stakeTagText(stake, rev) {
  if (stake === '低') return '低赌注 · 不至于';
  const revMap = { '可逆':'可逆 · 还有退路', '半可逆':'半可逆 · 一只脚已经踏出去了', '不可逆':'不可逆 · 已成定局' };
  return '高赌注 · ' + (revMap[rev] || '');
}

async function fireOpposition() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }

  const btn = document.getElementById('fire');
  btn.disabled = true;
  btn.textContent = '思考中…';

  document.getElementById('gaugeRow').classList.remove('show');
  document.getElementById('receipt').classList.remove('show');
  document.getElementById('againRow').classList.remove('show');
  document.getElementById('receiptBody').innerHTML = '';

  try {
    const response = await fetch("/api/oppose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    const data = await response.json();

    if (!response.ok) {
      document.getElementById('receipt').classList.add('show');
      document.getElementById('receiptBody').textContent =
        '后端调用出错：' + (data.error || '未知错误') +
        (data.detail ? '\n\n详细信息：' + data.detail : '');
      return;
    }

    const full = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('').trim();

    if (!full) {
      document.getElementById('receipt').classList.add('show');
      document.getElementById('receiptBody').textContent =
        '模型返回了空内容，原始响应：' + JSON.stringify(data).slice(0, 500);
      return;
    }

    // 先检查是不是安全模式——命中的话跳过赌注仪表和"判词"包装，直接显示回应
    const safetyMatch = full.match(/^\[模式[:：]\s*安全\s*\]\s*\n+([\s\S]*)$/);
    if (safetyMatch) {
      document.getElementById('gaugeRow').classList.remove('show');
      const receipt = document.getElementById('receipt');
      receipt.classList.add('show');
      document.getElementById('stamp').textContent = '';
      await typeOut(safetyMatch[1].trim());
      caseNum++;
      document.getElementById('caseCount').textContent = caseNum;
      setCaseId(caseNum);
      document.getElementById('againRow').classList.add('show');
      return;
    }

    const match = full.match(/^\[赌注[:：]\s*(低|高)\s*\|\s*可逆性[:：]\s*(可逆|半可逆|不可逆|NA)\s*\]\s*\n+([\s\S]*)$/);
    let stake = '高', rev = 'NA', body = full;
    if (match) { stake = match[1]; rev = match[2]; body = match[3].trim(); }

    const pct = stakeToPercent(stake, rev);
    document.getElementById('needle').style.left = pct + '%';
    document.getElementById('gaugeTag').textContent = stakeTagText(stake, rev);
    document.getElementById('gaugeRow').classList.add('show');

    const now = new Date();
    document.getElementById('stamp').textContent =
      now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});

    const receipt = document.getElementById('receipt');
    receipt.classList.add('show');
    await typeOut(body);

    caseNum++;
    document.getElementById('caseCount').textContent = caseNum;
    setCaseId(caseNum);

    document.getElementById('againRow').classList.add('show');
  } catch (e) {
    document.getElementById('receipt').classList.add('show');
    document.getElementById('receiptBody').textContent = '连话都没说完就断了——跟你有点像。（网络请求失败，稍后再试）';
  } finally {
    btn.disabled = false;
    btn.textContent = '怼我';
  }
}

function typeOut(text) {
  return new Promise(resolve => {
    const el = document.getElementById('receiptBody');
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        el.appendChild(cursor);
        i += 2;
        setTimeout(step, 12);
      } else {
        el.textContent = text;
        resolve();
      }
    }
    step();
  });
}

document.getElementById('fire').addEventListener('click', fireOpposition);
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) fireOpposition();
});
document.getElementById('again').addEventListener('click', () => {
  document.getElementById('input').value = '';
  document.getElementById('input').focus();
  document.getElementById('receipt').classList.remove('show');
  document.getElementById('gaugeRow').classList.remove('show');
  document.getElementById('againRow').classList.remove('show');
});
</script>
</body>
</html>
